name: Linting

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: biomejs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3.1.2
        with:
          node-version-file: '.nvmrc'
          cache: true
          require-lockfile: true

      - run: pnpm lint:check
