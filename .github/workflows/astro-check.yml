name: Astro Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  astro-check:
    name: astro check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: '.nvmrc'
          cache: true
          require-lockfile: true

      - name: Check Astro diagnostics
        run: pnpm check
